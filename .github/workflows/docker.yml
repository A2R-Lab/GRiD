name: Docker image
# Builds install/docker/Dockerfile and pushes ghcr.io/a2r-lab/grid:<version>
# and :latest. The image installs grid-rbd==<version> from PyPI, so it is built
# after publish.yml has completed successfully for a tag (the pypi environment
# approval is the last step of that workflow), or by hand (workflow_dispatch)
# from a checkout whose pyproject version is already on PyPI. No credentials
# beyond GITHUB_TOKEN.
on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve the version from pyproject.toml
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' pyproject.toml)
          tag="${{ github.event.workflow_run.head_branch }}"
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "tag $tag != v$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Free runner disk (the CUDA devel base plus the framework wheels need tens of GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: install/docker/Dockerfile
          push: true
          build-args: |
            GRID_RBD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/a2r-lab/grid:${{ steps.version.outputs.version }}
            ghcr.io/a2r-lab/grid:latest

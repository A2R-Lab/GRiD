name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'bindings/grid_rbd/**'
      - 'grid_codegen/**'
      - 'external/**'
      - 'pyproject.toml'
      - '.gitmodules'
      - '.github/workflows/gh-pages.yml'
  push:
    branches: [main, modernizing-tests]
    paths:
      - 'docs/**'
      - 'bindings/grid_rbd/**'
      - 'grid_codegen/**'
      - 'external/**'
      - 'pyproject.toml'
      - '.gitmodules'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies (no CUDA build)
        run: python -m pip install -r docs/requirements.txt
      - name: Test site assembly and link checks
        run: python -m unittest discover -s docs -p 'test_site.py' -v
      - name: Build documentation (fail on warnings)
        env:
          GRID_DOCS_REF: ${{ github.head_ref || github.ref_name }}
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html
      - name: Assemble cover, docs, and legacy redirects
        run: python docs/build_site.py
      - name: Check links, anchors, and redirects
        run: python docs/check_site.py docs/build/site
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-website-preview
          path: docs/build/site
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4

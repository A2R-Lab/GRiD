name: Verify GPU Proof

# CPU-only CI. No GPU, no secrets. Two independent jobs:
#   1. verify-receipt — requires and validates the committed gpu-proof.json
#      (signature via github.com/{signer}.keys, code fingerprint, commit SHA,
#      freshness, allow_dirty:false + expected-skips policy). This is what lets
#      GPU correctness gate merges without paying for GPU CI. Missing evidence
#      is an error; everyday-policy carried shards remain allowed.
#   2. cpu-lane — the GRiD tests that need no GPU (descriptor parity, kernel-attr
#      manifest, plant launch hygiene), always run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules needed: the receipt fingerprint pins submodules by their
          # gitlink SHA (it never descends into them), and the verifier is now the
          # pytest-gpu-proof PyPI package rather than the old vendored submodule.
          fetch-depth: 0            # commit-SHA check compares against full history

      - name: Require receipt
        run: |
          if [[ ! -s gpu-proof.json ]]; then
            echo "::error::Missing GPU receipt. Record the full everyday scope with test/run_gpu_proof.sh."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest-gpu-proof
        # pyyaml is required by `gpu-proof verify` when --policy is a .yaml file
        # (verify.py imports yaml); the plugin package itself does not depend on it.
        run: pip install "$(grep -o '^pytest-gpu-proof==[0-9.]*' install/requirements-dev.txt)" pyyaml  # the ONE pin lives in install/requirements-dev.txt

      - name: Verify receipt
        # The signer's public keys come from github.com/{user}.keys — no secrets.
        # The expected-skip baseline is mandatory; the exact test scope is the
        # policy's required_test_manifest (test/gpu-proof-tests.txt).
        run: |
          gpu-proof verify \
            --receipt gpu-proof.json \
            --repo . \
            --policy test/gpu-proof-policy.yaml \
            --expected-skips test/gpu-proof-expected-skips.txt

      - name: Verify secondary receipts
        # Every receipt listed in test/gpu-proof-receipts.yaml that exists on
        # disk (the Jetson rows under receipts/) is verified against the commit
        # it was recorded at: signature, scope, results and its own
        # expected-skips baseline, with that commit an ancestor of this one. A
        # secondary receipt attests the source it ran on, which the
        # compatibility page states; it is not required to match the tip. A
        # missing secondary is reported, not an error.
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, yaml
          table = yaml.safe_load(open('test/gpu-proof-receipts.yaml'))
          rc = 0
          for row in table.get('secondary') or []:
              path = row['receipt']
              head = f"sm_{row['arch']} {row['label']} {path}"
              if not os.path.exists(path):
                  print(f'{head}: not recorded')
                  continue
              commit = json.load(open(path))['repo']['commit_sha']
              if subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'HEAD']).returncode:
                  print(f'{head}: recorded commit {commit[:7]} is not an ancestor; FAIL')
                  rc = 1
                  continue
              tree = os.path.join(os.environ['RUNNER_TEMP'], f"receipt-sm{row['arch']}")
              subprocess.run(['git', 'worktree', 'add', '--detach', tree, commit], check=True)
              skips = row.get('expected_skips', 'test/gpu-proof-expected-skips.txt')
              proc = subprocess.run(
                  ['gpu-proof', 'verify', '--receipt', os.path.abspath(path), '--repo', tree,
                   '--policy', os.path.join(tree, 'test/gpu-proof-policy.yaml'),
                   '--expected-skips', os.path.abspath(skips)])
              print(f"{head}: attests {commit[:7]}; {'ok' if proc.returncode == 0 else 'FAIL'}")
              rc |= proc.returncode != 0
          sys.exit(rc)
          PY

  cpu-lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The receipt is recorded on 3.12; the lane also runs on the oldest and
        # the newest interpreter the wheels are built for (2026-10-15).
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install GRiD (CPU deps only)
        # Packaging unit tests import the build hooks outside pip's isolated
        # build environment, so their setuptools dependency must be explicit.
        # The pinned plugin supports every interpreter in this matrix; receipt
        # tooling and scope regressions must also execute on Python 3.10.
        run: |
          pip install -e . && pip install pytest matplotlib pyyaml "setuptools>=77"
          pip install "$(grep -o '^pytest-gpu-proof==[0-9.]*' install/requirements-dev.txt)"
          # The Pinocchio anchors of the CPU lane (test_manifold_conventions,
          # test_urdf_oracle) import pinocchio; the same load-bearing pins as
          # install/requirements-dev.txt and the RBDReference peer suite.
          # cmeel-tinyxml2 11 ships libtinyxml2.so.11; pin 3.9 links .so.10.
          pip install "pin<4" cmeel-eigen "cmeel-urdfdom<5" "cmeel-tinyxml2<11"

      # The BROAD CPU set (audit W00, 2026-09-19): every test/test_*.py + the
      # benchmark-spec guards + the CPU-only bindings modules. The former six-
      # module hand-list let nine integration-tail failures (registry/arena/
      # macro/bench-spec/ABI rows of a new algorithm) sit unnoticed for two
      # days. Anything here that needs a GPU, nvcc, jax or torch must
      # importorskip/skip itself; the lane installs CPU deps only. GPU suites
      # (test/cuda_equivalents, test/python_wrappers) stay on the receipt path.
      - name: Run CPU-only lane
        run: |
          python -m pytest \
            test/test_*.py \
            test/benchmarks/test_*.py \
            test/cuda_equivalents/test_pin_only_default.py \
            test/cuda_equivalents/test_cuda_matmul_blockwrap_regression.py \
            bindings/tests/test_mujoco_view.py \
            bindings/tests/test_mujoco_transforms.py \
            bindings/tests/test_register_forwarding.py \
            docs/test_doc_examples.py \
            -q

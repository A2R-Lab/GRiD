name: Verify GPU Proof

# CPU-only CI. No GPU, no secrets. Two independent jobs:
#   1. verify-receipt — validates the committed gpu-proof.json IF one is present
#      (signature via github.com/{signer}.keys, code fingerprint, commit SHA,
#      freshness, allow_dirty:false + expected-skips policy). This is what lets
#      GPU correctness gate merges without paying for GPU CI. It SKIPS gracefully
#      when no receipt is committed yet, so code changes can ship before the
#      (long) GPU receipt run happens — downstream adopts immediately; the receipt
#      lands later and activates enforcement.
#   2. cpu-lane — the GRiD tests that need no GPU (descriptor parity, kernel-attr
#      manifest, plant launch hygiene), always run.

on:
  push:
    branches: [modernizing-tests, main]
  pull_request:
    branches: [modernizing-tests, main]

jobs:
  verify-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules needed: the receipt fingerprint pins submodules by their
          # gitlink SHA (it never descends into them), and the verifier is now the
          # pytest-gpu-proof PyPI package rather than the old vendored submodule.
          fetch-depth: 0            # commit-SHA check compares against full history

      - name: Detect receipt
        id: detect
        run: |
          if [[ -f gpu-proof.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No gpu-proof.json committed yet — skipping receipt verification. Generate one with test/run_gpu_proof.sh on a GPU box and commit it to enable enforcement."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install pytest-gpu-proof
        if: steps.detect.outputs.present == 'true'
        # pyyaml is required by `gpu-proof verify` when --policy is a .yaml file
        # (verify.py imports yaml); the plugin package itself does not depend on it.
        run: pip install pytest-gpu-proof pyyaml

      - name: Verify receipt
        if: steps.detect.outputs.present == 'true'
        # The signer's public keys come from github.com/{user}.keys — no secrets.
        # --expected-skips is applied only if a baseline file is present.
        run: |
          SKIPS_ARG=()
          if [[ -f test/gpu-proof-expected-skips.txt ]]; then
            SKIPS_ARG=(--expected-skips test/gpu-proof-expected-skips.txt)
          fi
          gpu-proof verify \
            --receipt gpu-proof.json \
            --repo . \
            --policy test/gpu-proof-policy.yaml \
            "${SKIPS_ARG[@]}"

  cpu-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GRiD (CPU deps only)
        run: pip install -e . && pip install pytest

      - name: Run CPU-only lane
        run: |
          python -m pytest \
            test/test_algo_descriptor_parity.py \
            test/test_kernel_attr_manifest_consistency.py \
            test/test_plant_launch_hygiene.py \
            -v

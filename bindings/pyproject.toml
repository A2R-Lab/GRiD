[build-system]
requires = ["setuptools>=61", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-rbd"
version = "0.1.0"
description = "GPU-accelerated rigid body dynamics for batched robot dynamics computations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "GRiD Authors"},
]
dependencies = [
    "numpy>=1.23",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Backend extras mirror the jax-vs-jax[cuda] pattern: the user picks the GPU
# wheel (jax[cuda] / a torch cu1xx build) matching their arch; we only pin the
# minimum API version. No upper cap — an over-tight cap just blocks users.
jax = [
    "jax>=0.4.40",
]
torch = [
    "torch>=2.1",
]
# Both backend surfaces in one shot (recursive self-extras). NO dev/benchmark
# weight here, and NO cuRobo — cuRobo installs last via the bench channel.
all = [
    "grid-rbd[jax]",
    "grid-rbd[torch]",
]
# The bindings' own test deps only. The heavy comparator/oracle stack
# (pinocchio/mjx/frax/bard) lives in the repo-root requirements-dev.txt /
# developer_install.sh — a separate channel, deliberately not pulled in here.
dev = [
    "pytest>=7.0",
]

[project.scripts]
grid-rbd = "grid_rbd._cli:main"

[tool.setuptools]
# We have a C++ extension; setup.py owns the Extension declaration.
include-package-data = true

[tool.setuptools.packages.find]
include = ["grid_rbd*"]

[tool.setuptools.package-data]
grid_rbd = ["wrapper_template.cu"]

# pytest-gpu-proof RELEASE verification policy for GRiD.
#
# The everyday policy (gpu-proof-policy.yaml) accepts CARRIED shards so a
# routine push goes green in ~minutes-to-an-hour by re-proving only the shards
# whose test files changed. This policy is the release gate: it refuses carried
# shards entirely, so a release receipt must come from ONE fresh full
# `SPLIT=1 test/run_gpu_proof.sh` pass at the release tip — every shard
# executed at that exact commit, nothing inherited.
#
#   .venv/bin/gpu-proof verify --receipt gpu-proof.json --repo . \
#       --policy test/gpu-proof-policy-release.yaml \
#       --expected-skips test/gpu-proof-expected-skips.txt
#
# Require the complete correctness scope. The verifier accepts descendants of
# the tested commit, but code/bindings/peer-pin changes must invalidate evidence.
# Docs/website edits are intentionally excluded and do not require new GPU runs.
allow_dirty: false
max_age_days: 30
allow_carried: false
required_fingerprint_paths:
  - grid_codegen
  - bindings/grid_rbd
  - bindings/src
  - external/GLASS
  - external/RBDReference
  - external/URDFParser
  - config
  - pyproject.toml
  - setup.py
  - test/cuda_equivalents
  - test/python_wrappers
  - test/conftest.py
  - test/helpers.py
  - test/run_gpu_proof.sh
  - test/run_split_suite.py
  - test/compile_sched.py
  - test/prewarm_cuda_flagship.py
  - test/codegen_neutrality.py
  - test/header_key_replay.py
  - test/receipt_integrity.py
  - test/gpu-proof-scope.json
  - test/run_validation.py
required_fingerprint_extra_paths: []
required_fingerprint_excluded_paths: [gpu-proof.json]
